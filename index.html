<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Robot Control Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Guide Robot Control Center</h1>
        <nav>
            <button class="nav-btn active" onclick="switchTab('main')">Main</button>
            <button class="nav-btn" onclick="switchTab('ai')">Local AI</button>
        </nav>
    </header>

    <!-- 1. MAIN TAB -->
    <div id="tab-main" class="tab-content active">
        <h2>Interactive Panel</h2>
        <div id="status">Status: Idle</div>
        <p><strong>Response Text:</strong> <span id="current-response">Select a trigger...</span></p>
        <div id="trigger-buttons"></div>
    </div>

    <!-- 2. LOCAL AI TAB -->
    <div id="tab-ai" class="tab-content">
        <h2>In-Browser STT & TTS Voice Engine</h2>
        <button class="action-btn" onclick="startSTT()">Start Microphone (STT)</button>
        <p><strong>Heard Speech:</strong> <span id="stt-result">None</span></p>
        <p><strong>AI Answer:</strong> <span id="ai-result">None</span></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
